{ "imports": {

<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';

/* =========================================================
   기본 설정
   ========================================================= */
const LAT = 35.1532, LNG = 129.1186;      // 광안리 해수욕장
const VIEW_BEARING = 140;                  // 정면(광안대교) 방위각
const params = new URLSearchParams(location.search);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
let seed = 7; const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* =========================================================
   천문 계산 (SunCalc 포팅) - 실제 부산 해/달 위치
   ========================================================= */
const RAD = Math.PI / 180, DAYMS = 864e5, J1970 = 2440588, J2000 = 2451545, OBL = RAD * 23.4397;
const toDays = ms => ms / DAYMS - 0.5 + J1970 - J2000;
const rAsc = (l, b) => Math.atan2(Math.sin(l) * Math.cos(OBL) - Math.tan(b) * Math.sin(OBL), Math.cos(l));
const decl = (l, b) => Math.asin(Math.sin(b) * Math.cos(OBL) + Math.cos(b) * Math.sin(OBL) * Math.sin(l));
const azim = (H, phi, d) => Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(d) * Math.cos(phi));
const alti = (H, phi, d) => Math.asin(Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.cos(H));
const sidereal = (d, lw) => RAD * (280.16 + 360.9856235 * d) - lw;
function sunCoords(d) {
  const M = RAD * (357.5291 + 0.98560028 * d);
  const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + RAD * 102.9372 + Math.PI;
  return { dec: decl(L, 0), ra: rAsc(L, 0) };
}
function moonCoords(d) {
  const L = RAD * (218.316 + 13.176396 * d), M = RAD * (134.963 + 13.064993 * d), F = RAD * (93.272 + 13.229350 * d);
  const l = L + RAD * 6.289 * Math.sin(M), b = RAD * 5.128 * Math.sin(F), dist = 385001 - 20905 * Math.cos(M);
  return { ra: rAsc(l, b), dec: decl(l, b), dist };
}
function bodyPos(ms, coordsFn) {
  const lw = RAD * -LNG, phi = RAD * LAT, d = toDays(ms), c = coordsFn(d), H = sidereal(d, lw) - c.ra;
  return { bearing: azim(H, phi, c.dec) / RAD + 180, alt: alti(H, phi, c.dec) };
}
const sunPos = ms => bodyPos(ms, sunCoords);
const moonPos = ms => bodyPos(ms, moonCoords);
function moonIllum(ms) {
  const d = toDays(ms), s = sunCoords(d), m = moonCoords(d), sdist = 149598000;
  const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
  const inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi));
  const ang = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra), Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
  return { fraction: (1 + Math.cos(inc)) / 2, phase: 0.5 + 0.5 * inc * (ang < 0 ? -1 : 1) / Math.PI };
}
function dirFrom(bearing, altRad) {
  const d = (bearing - VIEW_BEARING) * RAD, c = Math.cos(altRad);
  return new THREE.Vector3(Math.sin(d) * c, Math.sin(altRad), -Math.cos(d) * c);
}
// KST 유틸
const kst = ms => { const d = new Date(ms + 9 * 3600e3); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds(), dow: d.getUTCDay() }; };
const kstMidnight = ms => { const p = kst(ms); return Date.UTC(p.y, p.m, p.d) - 9 * 3600e3; };
const hhmm = ms => { const p = kst(ms); return String(p.h).padStart(2, '0') + ':' + String(p.mi).padStart(2, '0'); };
let sunTimesCache = { key: null };
function sunTimes(ms) {
  const m0 = kstMidnight(ms);
  if (sunTimesCache.key === m0) return sunTimesCache;
  let rise = null, set = null, prev = sunPos(m0).alt / RAD;
  for (let i = 1; i <= 720; i++) {
    const t = m0 + i * 120000, a = sunPos(t).alt / RAD;
    if (prev < -0.833 && a >= -0.833) rise = t;
    if (prev >= -0.833 && a < -0.833) set = t;
    prev = a;
  }
  sunTimesCache = { key: m0, rise, set };
  return sunTimesCache;
}

/* =========================================================
   시간 상태 (실시간 / 시간 정하기 / 타임랩스)
   ========================================================= */
const T = { mode: 'real', hour: 18, lapseBase: 0, lapseStart: 0 };
if (params.get('t')) { const [h, m] = params.get('t').split(':').map(Number); T.mode = 'fixed'; T.hour = h + (m || 0) / 60; }
function simNow() {
  if (T.mode === 'fixed') return kstMidnight(Date.now()) + T.hour * 3600e3;
  if (T.mode === 'lapse') return T.lapseBase + (performance.now() - T.lapseStart) * 360; // 1시간 = 10초
  return Date.now();
}

/* =========================================================
   렌더러 / 씬 / 카메라
   ========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.5;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb7cde0, 0.00013);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 30000);

/* ---------- 지형 함수 ---------- */
const zShore = x => { const t = clamp(x / 760, -1.4, 1.4); return -15 - 240 * t * t; };
function sandH(x, z) {
  const d = z - zShore(x);
  if (d >= 0) return Math.min(d, 95) * 0.022 + Math.max(0, d - 95) * 0.004;
  return Math.max(d * 0.05, -8);
}
const SIT = new THREE.Vector3(0, sandH(0, 0.2) + 0.025, 0.2);

/* ---------- 하늘 ---------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
  uniforms: { uSun: { value: new THREE.Vector3(0, 1, 0) }, uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
    uGlow: { value: new THREE.Color() }, uBelt: { value: new THREE.Color() }, uGlowS: { value: 0 }, uBeltS: { value: 0 }, uSunVis: { value: 1 } },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 uSun, uZen, uHor, uGlow, uBelt; uniform float uGlowS, uBeltS, uSunVis; varying vec3 vP;
    void main(){
      vec3 d = normalize(vP); float h = d.y, hh = clamp(h, 0., 1.);
      vec3 col = mix(uHor, uZen, pow(hh, 0.45));
      float cs = dot(d, uSun);
      vec2 dxz = normalize(d.xz + 1e-5), sxz = normalize(uSun.xz + 1e-5);
      float side = max(dot(dxz, sxz), 0.);
      float glow = (pow(max(cs,0.), 8.)*0.85 + pow(side, 2.5)*exp(-hh*6.)*0.75) * uGlowS;
      col = mix(col, uGlow, clamp(glow, 0., 1.));
      float belt = pow(max(-dot(dxz, sxz), 0.), 1.2) * exp(-pow((hh-0.06)/0.075, 2.)) * uBeltS;
      col = mix(col, uBelt, clamp(belt, 0., 1.));
      float disk = smoothstep(0.99972, 0.99986, cs) * uSunVis;
      float halo = (pow(max(cs,0.), 900.)*0.8 + pow(max(cs,0.), 90.)*0.25) * uSunVis;
      col += uGlow*halo + vec3(1., .96, .88)*disk*2.;
      if (h < 0.) col = uHor*mix(1., 0.75, clamp(-h*6., 0., 1.));
      gl_FragColor = vec4(col, 1.);
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(15000, 48, 24), skyMat); scene.add(sky);
// 고도별 하늘색 키프레임 [태양고도, 천정, 수평선, 해쪽 빛, 반대편 분홍띠, 빛세기, 띠세기]
const SKY_KEYS = [
  [-90, '#02040a', '#0d1120', '#000000', '#000000', 0, 0],
  [-14, '#03060f', '#151a2e', '#1b1630', '#000000', 0.25, 0],
  [-9, '#08112a', '#262b4e', '#5b3a58', '#2e2a4a', 0.5, 0.2],
  [-5, '#16295a', '#4f5288', '#c7755e', '#8a6e9a', 0.85, 0.45],
  [-1.5, '#27467f', '#9a86a6', '#ff9259', '#dc9db4', 1, 0.6],
  [2, '#3a64a4', '#e2ae96', '#ffa865', '#eeadbb', 1, 0.5],
  [7, '#4677bb', '#eec9aa', '#ffd197', '#e9c3c6', 0.7, 0.25],
  [16, '#2f6fc4', '#a9c8e6', '#fff0d2', '#ffffff', 0.4, 0],
  [90, '#2a68bf', '#a6c6e6', '#fff6e2', '#ffffff', 0.3, 0],
].map(k => [k[0], new THREE.Color(k[1]), new THREE.Color(k[2]), new THREE.Color(k[3]), new THREE.Color(k[4]), k[5], k[6]]);
const skyHor = new THREE.Color();
function setSky(alt) {
  let i = 0; while (i < SKY_KEYS.length - 2 && alt > SKY_KEYS[i + 1][0]) i++;
  const a = SKY_KEYS[i], b = SKY_KEYS[i + 1], t = ss(a[0], b[0], alt), u = skyMat.uniforms;
  u.uZen.value.copy(a[1]).lerp(b[1], t); u.uHor.value.copy(a[2]).lerp(b[2], t);
  u.uGlow.value.copy(a[3]).lerp(b[3], t); u.uBelt.value.copy(a[4]).lerp(b[4], t);
  u.uGlowS.value = lerp(a[5], b[5], t); u.uBeltS.value = lerp(a[6], b[6], t);
  u.uSunVis.value = ss(-1.2, 0.3, alt);
  skyHor.copy(u.uHor.value);
}

// 별
{
  const n = 700, pos = new Float32Array(n * 3), sz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), e = Math.asin(rand(0.06, 1)), r = 13000;
    pos.set([Math.cos(e) * Math.cos(a) * r, Math.sin(e) * r, Math.cos(e) * Math.sin(a) * r], i * 3);
    sz[i] = Math.pow(Math.random(), 4) * 2.4 + 0.7;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aS', new THREE.BufferAttribute(sz, 1));
  var stars = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
    uniforms: { uA: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uT: { value: 0 } },
    vertexShader: `attribute float aS; uniform float uPR, uT; varying float vS;
      void main(){ vS = aS; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);
      gl_PointSize = aS*uPR*(0.85+0.15*sin(uT*2.+position.x)); }`,
    fragmentShader: `uniform float uA; varying float vS; void main(){ float d = length(gl_PointCoord-.5)*2.; float a = smoothstep(1.,0.,d);
      gl_FragColor = vec4(vec3(0.9,0.93,1.)*a, a*uA*min(1., vS*0.45)); }`
  }));
  stars.renderOrder = 2; sky.renderOrder = 0; scene.add(stars);
}

// 달
const moonCanvas = document.createElement('canvas'); moonCanvas.width = moonCanvas.height = 128;
const moonTex = new THREE.CanvasTexture(moonCanvas); moonTex.colorSpace = THREE.SRGBColorSpace;
const moon = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: moonTex, transparent: true, depthWrite: false, fog: false }));
moon.scale.setScalar(190); moon.renderOrder = 3; scene.add(moon);

function drawMoon(phase) {

    const edge = clamp((1 - r2) * 8, 0, 1);

    let fx = Math.round(Math.cos(ang) * f), fy = Math.round(Math.sin(ang) * f); if (!fx && !fy) fx = 1;

  }

    for (const w of waves) { const ph = 2 * Math.PI * (w.fx * u + w.fy * v) + w.p, c2 = Math.cos(ph) * w.a * 2 * Math.PI; dx += c2 * w.fx; dy += c2 * w.fy; }
    const s = 0.05; let nx = -dx * s, ny = -dy * s, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;

}

const WAVE_T = 9.0;

  vertexShader: `attribute float aD; varying float vD; varying vec2 vXZ; varying float vDist;

  fragmentShader: `uniform float uTime, uLight; uniform vec3 uShallow; varying float vD; varying vec2 vXZ; varying float vDist;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
    float fbm(vec2 p){ return 0.55*noise(p)+0.3*noise(p*2.3)+0.15*noise(p*5.1); }
    void main(){

        float fi = float(i);
        float ph = fract(uTime/${WAVE_T.toFixed(1)} + fi*0.5 + vXZ.x*0.0006 + 0.04*sin(vXZ.x*0.011+fi*2.));
        float run = 3.0 + 2.2*sin(vXZ.x*0.017 + fi*3.1 + floor(uTime/${WAVE_T.toFixed(1)})*1.7);
        float n = fbm(vXZ*vec2(0.35,0.9) + vec2(uTime*0.15, fi*13.));

    e.frequency.setValueAtTime(ef * 1.06, t); e.frequency.setValueAtTime(ef * 1.06, t + dur * 0.44); e.frequency.linearRampToValueAtTime(ef * 0.92, t + dur * 0.56);
    e.connect(el).connect(eg).connect(g);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.13 * loud, t + dur * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    p.pan.setValueAtTime(-0.9 * dir, t); p.pan.linearRampToValueAtTime(0.9 * dir, t + dur);
    g.connect(lp).connect(p).connect(this.bus.cars);
    s.start(t, rand(0, 5)); h.start(t, rand(0, 3)); e.start(t); s.stop(t + dur + 0.1); h.stop(t + dur + 0.1); e.stop(t + dur + 0.1);
  }

    o.connect(f1).connect(amp); o.connect(f2).connect(f2g).connect(amp);

  }

const amb = new Ambience();

/* =========================================================
   시간대별 활동량
   ========================================================= */
function curve(pts, h) { for (let i = 0; i < pts.length - 1; i++) { const [h0, v0] = pts[i], [h1, v1] = pts[i + 1]; if (h >= h0 && h <= h1) return lerp(v0, v1, (h - h0) / (h1 - h0)); } return pts[pts.length - 1][1]; }

  const people = clamp(curve([[0, .35], [2, .15], [5, .06], [7, .2], [10, .35], [14, .55], [17, .7], [19.5, 1], [22.5, .85], [24, .35]], h) * wk, 0, 1);
  const cars = curve([[0, .35], [3, .15], [6, .4], [8, .9], [12, .8], [18, 1], [21, .8], [24, .35]], h);

/* =========================================================
   환경 업데이트
   ========================================================= */
const C = (h) => new THREE.Color(h);
const cDay = C(0xb9cfe2), cGold = C(0xe9b48d), cDusk = C(0x6e5b7e), cNight = C(0x161a2c);
const env = { night: 0, day: 1, warm: 0, act: null, sunAlt: 0, ledT: 0 };
const sunDir = new THREE.Vector3(), moonDir = new THREE.Vector3();
function updateEnv(ms) {

  const alt = sp.alt / RAD; env.sunAlt = alt;
  sunDir.copy(dirFrom(sp.bearing, sp.alt)); moonDir.copy(dirFrom(mp.bearing, mp.alt));
  skyMat.uniforms.uSun.value.copy(sunDir); setSky(alt);
  const day = ss(-4, 10, alt), warm = ss(16, 1, alt) * ss(-7, -0.5, alt), night = ss(-2, -11, alt);
  env.day = day; env.warm = warm; env.night = night;

  stars.material.uniforms.uA.value = ss(-8, -17, alt) * 0.75;
  // 달

  if (Math.abs(mi.phase - lastMoonPhase) > 0.004) { drawMoon(mi.phase); lastMoonPhase = mi.phase; }

/* =========================================================
   카메라 조작
   ========================================================= */
const view = { mode: params.get('view') === '1p' ? '1p' : '3p', yaw: 0, pitch: -0.012, tYaw: 0, tPitch: -0.012, fov: 40, tFov: 40 };
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY };
  view.tYaw = clamp(view.tYaw - dx * 0.0032, -1.05, 1.05); view.tPitch = clamp(view.tPitch + dy * 0.0024, -0.38, 0.32);

const endDrag = () => { drag = null; canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => { e.preventDefault(); view.tFov = clamp(view.tFov + e.deltaY * 0.03, 18, 65); }, { passive: false });
function updateCamera(t) {
  view.yaw += (view.tYaw - view.yaw) * 0.08; view.pitch += (view.tPitch - view.pitch) * 0.08; view.fov += (view.tFov - view.fov) * 0.1;
  const asp = innerWidth / innerHeight, hTan = Math.tan(view.fov * 0.6 * RAD); // 세로 화면이면 좌우 시야를 넓혀줌
  const fov = asp < 1.1 ? Math.min(88, 2 * Math.atan(hTan / asp) / RAD) : view.fov;

/* =========================================================
   UI
   ========================================================= */
const $ = id => document.getElementById(id);
const icoOn = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 7a7 7 0 0 1 0 10"/></svg>';
const icoOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>';
let muted = true; $('btnSound').innerHTML = icoOff;
$('btnSound').onclick = () => {
  if (!amb.on) { amb.start(); muted = false; } else { muted = !muted; amb.mute(muted); }
  $('btnSound').innerHTML = muted ? icoOff : icoOn;
};
$('btnView').onclick = () => { view.mode = view.mode === '3p' ? '1p' : '3p'; toast(view.mode === '3p' ? '뒷모습 시점' : '내 눈 시점'); };
$('btnSettings').onclick = () => $('panel').classList.toggle('hidden');
$('btnShot').onclick = () => {
  const a = document.createElement('a'); a.download = `광안리_${hhmm(simNow()).replace(':', '')}.png`; a.href = canvas.toDataURL('image/png'); a.click();
  $('flash').style.transition = 'none'; $('flash').style.opacity = 0.7; requestAnimationFrame(() => { $('flash').style.transition = 'opacity .6s'; $('flash').style.opacity = 0; });
};
document.querySelectorAll('#panel input[data-k]').forEach(el => el.oninput = () => amb.setLevel(el.dataset.k, el.value / 100));
function setMode(m) {

  if (m === 'fixed') { const p = kst(simNow()); T.hour = Math.round((p.h + p.mi / 60) * 4) / 4; $('hourIn').value = T.hour; }
  T.mode = m;
  document.querySelectorAll('#timeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('hourRow').classList.toggle('show', m === 'fixed');
  $('hourLbl').textContent = hhmm(simNow());
}
document.querySelectorAll('#timeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('hourIn').oninput = e => { T.hour = +e.target.value; $('hourLbl').textContent = hhmm(simNow()); };
if (T.mode === 'fixed') { document.querySelectorAll('#timeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === 'fixed')); $('hourRow').classList.add('show'); $('hourIn').value = T.hour; }

let toastTimer; function toast(msg) { $('status').textContent = msg; $('status').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('status').classList.remove('show'), 3200); }
let sitStart = null;
$('go').onclick = () => {
  $('intro').classList.add('out'); sitStart = performance.now();
  if (!params.has('nosound')) { amb.start(); muted = false; $('btnSound').innerHTML = icoOn; }
  setTimeout(() => toast(phaseText()), 1600);
};
if (params.has('auto')) { $('intro').classList.add('out'); sitStart = performance.now(); }
let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 6000); };
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(e => addEventListener(e, wake)); wake();

function phaseText() {
  const a = env.sunAlt, ms = simNow(), st = sunTimes(ms), morning = kst(ms).h < 12;
  if (a > 12) return morning ? '맑은 오전, 파도 소리가 좋아요' : '한낮의 광안리';
  if (a > 0) return morning ? '해가 막 떠올랐어요' : '해가 지고 있어요 · 일몰 ' + hhmm(st.set);
  if (a > -7) return morning ? '여명이 밝아오는 중 · 일출 ' + hhmm(st.rise) : '노을이 번지는 시간';
  return env.act && env.act.led ? '광안대교에 불이 켜졌어요' : '조용한 밤바다';

/* =========================================================
   메인 루프
   ========================================================= */
let last = performance.now(), envT = 0, elapsed = 0, prevPh = [0, 0], lastPhaseText = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; elapsed += dt;
  const ms = simNow();
  envT -= dt; if (envT <= 0) { updateEnv(ms); envT = T.mode === 'lapse' ? 0.05 : 0.5; }
  // 시계
  const p = kst(ms);
  $('clock').textContent = new Date(ms).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: 'numeric', minute: '2-digit' });
  const st = sunTimes(ms); $('sunInfo').textContent = `일출 ${st.rise ? hhmm(st.rise) : '--'} · 일몰 ${st.set ? hhmm(st.set) : '--'}`;
  if (T.mode !== 'real') $('hourLbl').textContent = hhmm(ms);
  if (sitStart) { const s = Math.floor((now - sitStart) / 1000); $('timer').textContent = [s / 3600, (s / 60) % 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':'); }

  cars.forEach((c, i) => {
    c.x += c.v * dt; if (c.x > BR.x1) c.x = BR.x0; if (c.x < BR.x0) c.x = BR.x1;
    const on = c.act < act.cars * 0.85 + 0.1, n = bNorm(c.x), off = c.up ? 4 : -4;
    carPos[i * 3] = c.x + n.x * off; carPos[i * 3 + 1] = on ? deckY(c.x) + (c.up ? 0.9 : -6.2) : -500; carPos[i * 3 + 2] = bz(c.x) + n.y * off + (c.up ? 0 : 0);
  });
  carGeo.attributes.position.needsUpdate = true;
  // 사람들
  walkers.forEach(w => {
    if (!w.sitting) { w.x += w.v * dt; if (w.x > 300) w.x = -300; if (w.x < -300) w.x = 300; }
    const z = zShore(w.x) + w.d, bob = w.sitting ? 0 : Math.abs(Math.sin(elapsed * 5.2 + w.ph)) * 0.035;
    w.s.position.set(w.x, Math.max(sandH(w.x, z), 0.05) + bob, z);
  });
  // 캐릭터 숨쉬기
  parts.torso.scale.y = 1 + Math.sin(elapsed * 1.4) * 0.018;
  parts.head.position.y = 0.76 + Math.sin(elapsed * 1.4) * 0.004;
  parts.head.rotation.y = Math.sin(elapsed * 0.09) * 0.22 + Math.sin(elapsed * 0.031) * 0.12;
  parts.head.rotation.x = 0.05 + Math.sin(elapsed * 0.13) * 0.04;
  updateCamera(elapsed);

  renderer.render(scene, camera);

}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
updateEnv(simNow());
requestAnimationFrame(frame);
window.__dbg = { env, T, setMode, view, amb };
