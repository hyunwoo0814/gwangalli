<style>
  :root { --glass: rgba(18,22,30,.42); --line: rgba(255,255,255,.16); --txt: #f3f1ec; }
  * { box-sizing: border-box; }

  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c.drag { cursor: grabbing; }
  .pill { position: fixed; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 999px;

  #topL { top: 20px; left: 20px; }

  #topR svg { width: 19px; height: 19px; }
  #status { top: 76px; left: 50%; transform: translateX(-50%); font-size: 13px; padding: 8px 16px; opacity: 0; }
  #status.show { opacity: 1; }
  #bottom { bottom: 26px; left: 50%; transform: translateX(-50%); font-size: 13px; gap: 10px; padding: 10px 20px; }
  #bottom b { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; letter-spacing: .04em; }
  #bottom .dot { width: 6px; height: 6px; border-radius: 50%; background: #7fd1c7; box-shadow: 0 0 8px #7fd1c7; animation: br 4s ease-in-out infinite; }
  @keyframes br { 50% { opacity: .25; } }
  .idle .pill:not(#status), .idle #panel { opacity: 0; }
  #panel { position: fixed; top: 74px; right: 20px; width: 290px; padding: 16px 18px; border-radius: 18px; background: rgba(18,22,30,.62);
    border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: 13px; transition: opacity .3s; }
  #panel.hidden { display: none; }
  #panel h4 { margin: 4px 0 10px; font-size: 12px; font-weight: 600; opacity: .6; letter-spacing: .06em; }
  #panel h4:not(:first-child) { margin-top: 18px; }
  .row { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 8px; margin: 8px 0; }
  input[type=range] { width: 100%; accent-color: #9fd8d0; }
  .seg { display: flex; gap: 4px; background: rgba(255,255,255,.07); padding: 3px; border-radius: 10px; }
  .seg button { flex: 1; border: 0; padding: 7px 0; border-radius: 8px; background: transparent; color: var(--txt); font-size: 12px; cursor: pointer; }
  .seg button.on { background: rgba(255,255,255,.18); font-weight: 600; }
  #hourRow { display: none; }
  #hourRow.show { display: grid; }
  #intro { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, rgba(10,14,24,.15), rgba(4,6,12,.6)); overflow: auto;
    transition: opacity 1.4s; z-index: 10; }
  #intro.out { opacity: 0; pointer-events: none; }
  #intro .card { text-align: center; padding: 30px; max-width: 420px; }
  #intro h1 { font-size: 34px; margin: 0 0 14px; font-weight: 700; letter-spacing: .02em; }
  #intro p { margin: 0 0 26px; line-height: 1.7; opacity: .82; font-size: 15px; }
  #intro button { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-size: 16px; padding: 14px 30px;
    border-radius: 999px; cursor: pointer; backdrop-filter: blur(8px); }
  #intro button:hover { background: rgba(255,255,255,.22); }
  #intro small { display: block; margin-top: 16px; opacity: .55; font-size: 12px; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; padding: 4px 10px; border-radius: 999px; background: rgba(14,17,25,.55); border: 1px solid rgba(255,255,255,.16);
    font-size: 12px; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; gap: 5px; transform-origin: 50% 100%; }
  .lbl i { font-style: normal; width: 17px; height: 17px; border-radius: 50%; background: #7fd1c7; color: #08201e; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .prof { margin: 0 auto 22px; max-width: 300px; text-align: left; display: grid; gap: 10px; }
  .namerow { display: flex; gap: 6px; margin-bottom: 4px; }

  #intro .namerow button, .namerow button { padding: 0; font-size: 18px; width: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; font-size: 18px; cursor: pointer; }
  .swrow { display: grid; grid-template-columns: 52px 1fr; align-items: center; font-size: 13px; margin: 6px 0; }
  .sw { display: flex; gap: 8px; flex-wrap: wrap; }

  .shotbox { width: min(92vw, 900px); text-align: center; }

  .shotbtns button { white-space: nowrap; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; font-size: 15px; padding: 11px 22px; border-radius: 999px; cursor: pointer; }
  #shotSave { background: #e9f6f4 !important; color: #0c1a1a !important; font-weight: 600; }
  #intro .inapp { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: rgba(255,217,138,.12); border: 1px solid rgba(255,217,138,.35); color: #ffe2a6; font-size: 13px; line-height: 1.5; }
  #intro .inapp p { margin: 0 0 8px; opacity: 1; font-size: 13px; }
  #intro .inapp p.sub { margin: 8px 0 0; font-size: 11.5px; opacity: .75; }
  #intro .inapp button { font-size: 14px; padding: 9px 20px; background: #ffd98a; color: #2a1d00; border: 0; font-weight: 600; }
  #shotExt { background: #ffd98a !important; color: #2a1d00 !important; font-weight: 600; border: 0 !important; }

    #topL { top: 12px; left: 12px; padding: 8px 12px; gap: 8px; }

    #panel { right: 12px; left: 12px; width: auto; top: 64px; }
    #status { top: 64px; max-width: 86vw; text-align: center; }
    #topR button { width: 32px; height: 34px; }
    #topR #btnPeople { padding: 0 6px; }
    #topL { padding: 8px 10px; }
    #peopleList { top: 64px; right: 12px; }
    #intro .card { padding: 22px 18px; margin: 12px; }
    #intro h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topL" class="pill">
  <span class="logo">광안리</span><span class="sep"></span>
  <span id="clock">--:--</span>
  <span class="sub" id="sunInfo"></span>
</div>
<div id="topR" class="pill">
  <button id="btnPeople" title="함께 있는 사람"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><path d="M15.5 5.3a3 3 0 0 1 0 5.4M17.5 14.6c1.6.6 2.7 2 3 4.4"/></svg><span id="pc">–</span></button>
  <button id="btnSound" title="소리 켜기/끄기"></button>
  <button id="btnView" title="시점 바꾸기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/></svg>
  </button>
  <button id="btnSettings" title="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
  <button id="btnShot" title="장면 담기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
  </button>
</div>
<div id="status" class="pill"></div>
<div id="bottom" class="pill">
  <span class="dot"></span><b id="timer">00:00:00</b><span class="vsep"></span>
  <button class="act" id="btnSit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v6h5l1 5M12 11l-4 1"/><path d="M4 21h16"/></svg><span>일어서기</span></button>
  <button class="act" id="btnWave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6 7-2.5 0-4-1.3-5.4-3.4L3.8 13.8a1.5 1.5 0 0 1 2.4-1.8L8 14"/></svg><span>손 흔들기</span></button>
</div>
<div id="peopleList" class="hidden"></div>
<div id="labels"></div>

<div id="panel" class="hidden">
  <h4>내 캐릭터</h4>
  <div class="namerow"><input class="nameIn" maxlength="12" placeholder="이름"><button class="nameRand" title="다른 이름">↻</button></div>
  <div class="swrow"><span>비니</span><div class="sw" data-k="hat"></div></div>
  <div class="swrow"><span>후드</span><div class="sw" data-k="hood"></div></div>
  <div class="swrow"><span>돗자리</span><div class="sw" data-k="mat"></div></div>
  <h4>소리</h4>
  <div class="row"><span>전체</span><input type="range" min="0" max="100" value="80" data-k="master"></div>
  <div class="row"><span>파도</span><input type="range" min="0" max="100" value="90" data-k="waves"></div>
  <div class="row"><span>갈매기</span><input type="range" min="0" max="100" value="60" data-k="gulls"></div>
  <div class="row"><span>사람들</span><input type="range" min="0" max="100" value="55" data-k="people"></div>
  <div class="row"><span>자동차</span><input type="range" min="0" max="100" value="45" data-k="cars"></div>
  <h4>시간</h4>
  <div class="seg" id="timeSeg">
    <button data-m="real" class="on">실시간</button>
    <button data-m="fixed">시간 정하기</button>
    <button data-m="lapse">타임랩스</button>
  </div>
  <div class="row" id="hourRow"><span id="hourLbl">18:00</span><input type="range" id="hourIn" min="0" max="23.75" step="0.25" value="18"></div>
</div>

<div id="intro">
  <div class="card">
    <h1>광안리 바다멍</h1>
    <p>지금 이 시각, 부산 광안리 해변.<br>돗자리 펴고 광안대교 바라보며 잠깐 쉬어가요.</p>
    <div class="prof">
      <div class="namerow"><input class="nameIn" maxlength="12" placeholder="이름"><button class="nameRand" title="다른 이름">↻</button></div>
      <div class="swrow"><span>비니</span><div class="sw" data-k="hat"></div></div>
      <div class="swrow"><span>후드</span><div class="sw" data-k="hood"></div></div>
      <div class="swrow"><span>돗자리</span><div class="sw" data-k="mat"></div></div>
    </div>
    <button id="go">돗자리 들고 입장</button>
    <small id="introCount">파도 · 갈매기 · 사람들 · 차 소리가 나와요. 이어폰 추천</small>
  </div>
</div>
<div id="flash"></div>
<div id="shot" class="hidden">
  <div class="shotbox">
    <img id="shotImg" alt="광안리 바다멍 사진">
    <p id="shotTip"></p>
    <div class="shotbtns"><button id="shotSave">저장하기</button><button id="shotClose">닫기</button></div>
  </div>
</div>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';

/* =========================================================
   기본 설정
   ========================================================= */
const LAT = 35.1532, LNG = 129.1186;      // 광안리 해수욕장
const VIEW_BEARING = 140;                  // 정면(광안대교) 방위각
const params = new URLSearchParams(location.search);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
let seed = 7; const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* =========================================================
   천문 계산 (SunCalc 포팅) - 실제 부산 해/달 위치
   ========================================================= */
const RAD = Math.PI / 180, DAYMS = 864e5, J1970 = 2440588, J2000 = 2451545, OBL = RAD * 23.4397;
const toDays = ms => ms / DAYMS - 0.5 + J1970 - J2000;
const rAsc = (l, b) => Math.atan2(Math.sin(l) * Math.cos(OBL) - Math.tan(b) * Math.sin(OBL), Math.cos(l));
const decl = (l, b) => Math.asin(Math.sin(b) * Math.cos(OBL) + Math.cos(b) * Math.sin(OBL) * Math.sin(l));
const azim = (H, phi, d) => Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(d) * Math.cos(phi));
const alti = (H, phi, d) => Math.asin(Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.cos(H));
const sidereal = (d, lw) => RAD * (280.16 + 360.9856235 * d) - lw;
function sunCoords(d) {
  const M = RAD * (357.5291 + 0.98560028 * d);
  const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + RAD * 102.9372 + Math.PI;
  return { dec: decl(L, 0), ra: rAsc(L, 0) };
}
function moonCoords(d) {
  const L = RAD * (218.316 + 13.176396 * d), M = RAD * (134.963 + 13.064993 * d), F = RAD * (93.272 + 13.229350 * d);
  const l = L + RAD * 6.289 * Math.sin(M), b = RAD * 5.128 * Math.sin(F), dist = 385001 - 20905 * Math.cos(M);
  return { ra: rAsc(l, b), dec: decl(l, b), dist };
}
function bodyPos(ms, coordsFn) {
  const lw = RAD * -LNG, phi = RAD * LAT, d = toDays(ms), c = coordsFn(d), H = sidereal(d, lw) - c.ra;
  return { bearing: azim(H, phi, c.dec) / RAD + 180, alt: alti(H, phi, c.dec) };
}
const sunPos = ms => bodyPos(ms, sunCoords);
const moonPos = ms => bodyPos(ms, moonCoords);
function moonIllum(ms) {
  const d = toDays(ms), s = sunCoords(d), m = moonCoords(d), sdist = 149598000;
  const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
  const inc = Math.atan2(sdist * Math.sin(phi), m.dist - sdist * Math.cos(phi));
  const ang = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra), Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
  return { fraction: (1 + Math.cos(inc)) / 2, phase: 0.5 + 0.5 * inc * (ang < 0 ? -1 : 1) / Math.PI };
}
function dirFrom(bearing, altRad) {
  const d = (bearing - VIEW_BEARING) * RAD, c = Math.cos(altRad);
  return new THREE.Vector3(Math.sin(d) * c, Math.sin(altRad), -Math.cos(d) * c);
}
// KST 유틸
const kst = ms => { const d = new Date(ms + 9 * 3600e3); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds(), dow: d.getUTCDay() }; };
const kstMidnight = ms => { const p = kst(ms); return Date.UTC(p.y, p.m, p.d) - 9 * 3600e3; };
const hhmm = ms => { const p = kst(ms); return String(p.h).padStart(2, '0') + ':' + String(p.mi).padStart(2, '0'); };
let sunTimesCache = { key: null };
function sunTimes(ms) {
  const m0 = kstMidnight(ms);
  if (sunTimesCache.key === m0) return sunTimesCache;
  let rise = null, set = null, prev = sunPos(m0).alt / RAD;
  for (let i = 1; i <= 720; i++) {
    const t = m0 + i * 120000, a = sunPos(t).alt / RAD;
    if (prev < -0.833 && a >= -0.833) rise = t;

const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const ROOM = (params.get('room') || 'main').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 24) || 'main';

let entered = false;
const net = {
  ok: false, c: null, peers: new Map(), seen: {}, lastSend: 0, replyAt: 0,
  connect() {
    if (!window.mqtt) { setNetStatus(); return; }
    try {
      this.c = window.mqtt.connect(BROKER, {
        clientId: 'gw_' + myId + '_' + Math.random().toString(36).slice(2, 6), keepalive: 30, reconnectPeriod: 4000, connectTimeout: 9000, clean: true,
        will: { topic: `${TOPIC}/p/${myId}`, payload: JSON.stringify({ id: myId, bye: 1 }), qos: 0, retain: false },
      });
    } catch (e) { setNetStatus(); return; }
    this.c.on('connect', () => { this.ok = true; this.c.subscribe(`${TOPIC}/#`); if (entered) this.sendState(true); this.c.publish(`${TOPIC}/q/${myId}`, '1'); setNetStatus(); });
    this.c.on('close', () => { this.ok = false; setNetStatus(); });
    this.c.on('offline', () => { this.ok = false; setNetStatus(); });
    this.c.on('message', (topic, buf) => this.onMsg(topic, buf));
  },
  state() {
    const f = v => Math.round(v * 100) / 100;
    return { id: myId, n: profile.name, l: [profile.hat, profile.hood, profile.mat], x: f(me.x), z: f(me.z), r: f(me.r), s: me.sit ? 1 : 0 };
  },
  sendState(force) {
    if (!this.ok || !entered) return;
    const now = performance.now();
    if (!force && now - this.lastSend < 120) return;
    this.lastSend = now;
    this.c.publish(`${TOPIC}/p/${myId}`, JSON.stringify(this.state()));
  },
  sendEmote(e) { if (this.ok && entered) this.c.publish(`${TOPIC}/e/${myId}`, JSON.stringify({ id: myId, e })); },
  bye() { if (this.ok && entered) try { this.c.publish(`${TOPIC}/p/${myId}`, JSON.stringify({ id: myId, bye: 1 })); } catch (e) { } },
  onMsg(topic, buf) {
    const parts = topic.split('/'), kind = parts[parts.length - 2], from = parts[parts.length - 1];
    if (from === myId) return;
    if (kind === 'q') { this.replyAt = performance.now() + rand(150, 900); return; }
    let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
    if (!m || m.id !== from) return;
    if (kind === 'p') {
      if (m.bye) { this.removePeer(from); return; }
      if (![m.x, m.z, m.r].every(Number.isFinite)) return;
      const [x, z] = clampWalk(m.x, m.z);
      const look = { hat: clamp(m.l?.[0] | 0, 0, HAT_COLS.length - 1), hood: clamp(m.l?.[1] | 0, 0, HOOD_COLS.length - 1), mat: clamp(m.l?.[2] | 0, 0, 3) };

      if (!p) {
        if (this.peers.size >= 80) return;
        p = { id: from, x, z, r: m.r, tx: x, tz: z, tr: m.r, sit: !!m.s, sitT: m.s ? 1 : 0, walk: 0, ph: 0, waveStart: -99, av: makeAvatar(look), look: JSON.stringify(look) };

        this.peers.set(from, p);
        if (entered && !(this.seen[from] && Date.now() - this.seen[from] < 180000)) toast(`${cleanName(m.n)}님이 바다 보러 왔어요`);
        this.replyAt = performance.now() + rand(150, 900);
        updateCount();
      }
      p.name = cleanName(m.n); p.label.querySelector('span').textContent = p.name;
      if (JSON.stringify(look) !== p.look) { p.look = JSON.stringify(look); p.av.setLook(look); }
      p.tx = x; p.tz = z; p.tr = m.r; p.sit = !!m.s; p.last = performance.now(); this.seen[from] = Date.now();
      if (Math.hypot(p.tx - p.x, p.tz - p.z) > 40) { p.x = p.tx; p.z = p.tz; }
    } else if (kind === 'e') {
      const p = this.peers.get(from); if (!p) return;

    }
  },
  removePeer(id) { const p = this.peers.get(id); if (!p) return; p.av.dispose(); p.label.remove(); this.peers.delete(id); updateCount(); },
  update(dt, t) {

    }

  c.toBlob(b => { shotBlob = b; }, 'image/jpeg', 0.92);
  $('shotTip').textContent = inApp && isIOS ? '인스타 안에서는 아이폰이 사진 저장을 막아요. 사진을 길게 눌러보고, 안 되면 Safari로 열어 다시 찍어주세요.' : '안 되면 사진을 길게 눌러 저장할 수 있어요.';
  $('shot').classList.remove('hidden');
  $('flash').style.transition = 'none'; $('flash').style.opacity = 0.7; requestAnimationFrame(() => { $('flash').style.transition = 'opacity .6s'; $('flash').style.opacity = 0; });
};
$('shotSave').onclick = async () => {
  const blob = shotBlob || await (await fetch($('shotImg').src)).blob();
  const file = new File([blob], shotName, { type: 'image/jpeg' });
  if ((isIOS || inApp) && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '광안리 바다멍' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.download = shotName; a.href = URL.createObjectURL(blob); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  if (isIOS && inApp) toast('인스타 안에서는 저장이 막혀 있어요. 사진을 길게 눌러 저장해 주세요');
};
$('shotClose').onclick = () => $('shot').classList.add('hidden');
$('shot').onclick = e => { if (e.target.id === 'shot') $('shot').classList.add('hidden'); };
// 인스타·카톡 등 앱 안 브라우저 → Safari/크롬으로 바로 열기
function openExternal() {
  const here = location.href.replace(/^https?:\/\//, '');
  if (/KAKAOTALK/i.test(UA)) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  else if (isIOS) location.href = 'x-safari-https://' + here;
  else location.href = 'intent://' + here + '#Intent;scheme=https;package=com.android.chrome;end';
}
const extLabel = isIOS ? 'Safari로 열기' : '크롬으로 열기';
if (inApp) {
  const box = document.createElement('div'); box.className = 'inapp';
  box.innerHTML = `<p>${isIOS ? '인스타·카톡 안에서는 아이폰이 소리와 사진 저장을 막아요.' : '앱 안 브라우저에서는 일부 기능이 막힐 수 있어요.'}</p><button type="button">${extLabel}</button><p class="sub">안 열리면 오른쪽 위 ··· → "${isIOS ? 'Safari로 열기' : '다른 브라우저로 열기'}"</p>`;
  box.querySelector('button').onclick = openExternal;
  document.querySelector('#intro .card').appendChild(box);
  const b2 = document.createElement('button'); b2.id = 'shotExt'; b2.textContent = isIOS ? 'Safari에서 저장' : '크롬에서 저장'; b2.onclick = openExternal;
  document.querySelector('.shotbtns').prepend(b2);
}
document.querySelectorAll('#panel input[data-k]').forEach(el => el.oninput = () => amb.setLevel(el.dataset.k, el.value / 100));
function setMode(m) {
  if (m === 'lapse') { T.lapseBase = simNow(); T.lapseStart = performance.now(); }
  if (m === 'fixed') { const p = kst(simNow()); T.hour = Math.round((p.h + p.mi / 60) * 4) / 4; $('hourIn').value = T.hour; }
  T.mode = m;
  document.querySelectorAll('#timeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('hourRow').classList.toggle('show', m === 'fixed');
  $('hourLbl').textContent = hhmm(simNow());
}
document.querySelectorAll('#timeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('hourIn').oninput = e => { T.hour = +e.target.value; $('hourLbl').textContent = hhmm(simNow()); };
if (T.mode === 'fixed') { document.querySelectorAll('#timeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === 'fixed')); $('hourRow').classList.add('show'); $('hourIn').value = T.hour; }

let toastTimer; function toast(msg) { $('status').textContent = msg; $('status').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('status').classList.remove('show'), 3200); }
let sitStart = null;
const isTouch = matchMedia('(pointer: coarse)').matches;
// 캐릭터 꾸미기 (입장 화면 + 설정 패널 공용)
function buildSwatches() {
  document.querySelectorAll('.sw[data-k]').forEach(el => {
    const k = el.dataset.k, cols = k === 'hat' ? HAT_COLS : k === 'hood' ? HOOD_COLS : MAT_SW;
    el.innerHTML = '';
    cols.forEach((c, i) => {
      const b = document.createElement('button'); b.style.background = c; if (profile[k] === i) b.className = 'on';
      b.onclick = () => { profile[k] = i; saveProfile(); me.av.setLook(profile); buildSwatches(); net.sendState(true); };
      el.appendChild(b);
    });
  });
}
function setName(n) {
  profile.name = cleanName(n); saveProfile();
  me.label.querySelector('span').textContent = profile.name;
  document.querySelectorAll('.nameIn').forEach(i => { if (document.activeElement !== i) i.value = profile.name; });
  net.sendState(true);
}
document.querySelectorAll('.nameIn').forEach(i => { i.value = profile.name; i.onchange = () => setName(i.value); i.onkeydown = e => { if (e.key === 'Enter') { setName(i.value); i.blur(); } }; });
document.querySelectorAll('.nameRand').forEach(b => b.onclick = () => setName(randName()));
buildSwatches();
function updateSitBtn() { $('btnSit').querySelector('span').textContent = me.sit ? '일어서기' : '앉기'; }
let lastWave = -99;
function doWave() { if (!entered || elapsed - lastWave < 3) return; lastWave = elapsed; me.waveStart = elapsed; net.sendEmote('wave'); }
$('btnSit').onclick = () => setSit(!me.sit);
$('btnWave').onclick = doWave;
function updateCount() {
  const n = net.peers.size + (entered ? 1 : 0);
  $('pc').textContent = net.ok ? n : '–';
  $('introCount').textContent = net.ok ? `지금 ${net.peers.size}명이 광안리에 앉아 있어요 · 소리가 나와요, 이어폰 추천` : '파도 · 갈매기 · 사람들 · 차 소리가 나와요. 이어폰 추천';
  if (!$('peopleList').classList.contains('hidden')) renderPeople();
}
function setNetStatus() { $('btnPeople').title = net.ok ? '함께 있는 사람' : '연결 중… (연결이 안 되면 혼자 보기로 동작해요)'; updateCount(); }
function renderPeople() {
  const L = $('peopleList'); L.innerHTML = '';
  const h = document.createElement('h4'); h.textContent = net.ok ? `함께 있는 사람 ${net.peers.size + (entered ? 1 : 0)}명` : '연결 중이에요'; L.appendChild(h);
  const add = (n, mine) => { const d = document.createElement('div'); d.textContent = (mine ? '(나) ' : '') + n; L.appendChild(d); };
  if (entered) add(profile.name, true);
  for (const p of net.peers.values()) add(p.name || '...', false);
}
$('btnPeople').onclick = () => { $('peopleList').classList.toggle('hidden'); $('panel').classList.add('hidden'); renderPeople(); };
function enter(withSound) {
  if (entered) return;
  document.querySelectorAll('.nameIn').forEach(i => { if (i.value.trim()) profile.name = cleanName(i.value); });
  saveProfile(); me.label.querySelector('span').textContent = profile.name;
  entered = true; sitStart = performance.now();
  $('intro').classList.add('out');
  net.sendState(true); updateCount();
  if (withSound) { amb.start(); muted = false; $('btnSound').innerHTML = icoOn; }
  setTimeout(() => toast(isTouch ? '바닥을 누르면 걸어가요 · 두 번 누르면 거기 앉아요' : '바닥 클릭 또는 WASD로 걷기 · 더블클릭하면 거기 앉아요'), 1400);
  setTimeout(() => toast(phaseText()), 6500);
}
$('go').onclick = () => enter(!params.has('nosound'));
if (params.has('auto')) enter(false);
let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 6000); };
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(e => addEventListener(e, wake)); wake();

function phaseText() {
  const a = env.sunAlt, ms = simNow(), st = sunTimes(ms), morning = kst(ms).h < 12;
  if (a > 12) return morning ? '맑은 오전, 파도 소리가 좋아요' : '한낮의 광안리';
  if (a > 0) return morning ? '해가 막 떠올랐어요' : '해가 지고 있어요 · 일몰 ' + hhmm(st.set);
  if (a > -7) return morning ? '여명이 밝아오는 중 · 일출 ' + hhmm(st.rise) : '노을이 번지는 시간';
  return env.act && env.act.led ? '광안대교에 불이 켜졌어요' : '조용한 밤바다';
}

/* =========================================================
   메인 루프
   ========================================================= */
let last = performance.now(), envT = 0, elapsed = 0, prevPh = [0, 0], lastPhaseText = '';
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; elapsed += dt;
  const ms = simNow();
  envT -= dt; if (envT <= 0) { updateEnv(ms); envT = T.mode === 'lapse' ? 0.05 : 0.5; }
  // 시계
  const p = kst(ms);
  $('clock').textContent = new Date(ms).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: 'numeric', minute: '2-digit' });
  const st = sunTimes(ms); $('sunInfo').textContent = `일출 ${st.rise ? hhmm(st.rise) : '--'} · 일몰 ${st.set ? hhmm(st.set) : '--'}`;
  if (T.mode !== 'real') $('hourLbl').textContent = hhmm(ms);
  if (sitStart) { const s = Math.floor((now - sitStart) / 1000); $('timer').textContent = [s / 3600, (s / 60) % 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':'); }
  const pt = phaseText(); if (pt !== lastPhaseText && sitStart && elapsed > 3) { toast(pt); } lastPhaseText = pt;
  // 파도
  foamMat.uniforms.uTime.value = elapsed;
  water.material.uniforms.time.value += dt * 0.55;
  let trig = false;
  for (let i = 0; i < 2; i++) { const ph = (elapsed / WAVE_T + i * 0.5) % 1; if (prevPh[i] < 0.06 && ph >= 0.06) trig = true; prevPh[i] = ph; }
  // 다리 조명
  env.ledT = lerp(env.ledT || 0, env.ledTarget || 0, 0.02);
  lightMat.uniforms.uLed.value = env.ledT; lightMat.uniforms.uTime.value = elapsed; stars.material.uniforms.uT.value = elapsed;
  // 다리 위 차
  const act = env.act || { cars: 0.5, people: 0.5, gulls: 0.5 };
  cars.forEach((c, i) => {
    c.x += c.v * dt; if (c.x > BR.x1) c.x = BR.x0; if (c.x < BR.x0) c.x = BR.x1;
    const on = c.act < act.cars * 0.85 + 0.1, n = bNorm(c.x), off = c.up ? 4 : -4;
    carPos[i * 3] = c.x + n.x * off; carPos[i * 3 + 1] = on ? deckY(c.x) + (c.up ? 0.9 : -6.2) : -500; carPos[i * 3 + 2] = bz(c.x) + n.y * off + (c.up ? 0 : 0);
  });
  carGeo.attributes.position.needsUpdate = true;
  // 사람들
  walkers.forEach(w => {
    if (!w.sitting) { w.x += w.v * dt; if (w.x > 300) w.x = -300; if (w.x < -300) w.x = 300; }
    const z = zShore(w.x) + w.d, bob = w.sitting ? 0 : Math.abs(Math.sin(elapsed * 5.2 + w.ph)) * 0.035;
    w.s.position.set(w.x, Math.max(sandH(w.x, z), 0.05) + bob, z);
  });
  // 나와 다른 사람들
  updateMe(dt);
  poseAvatar(me.av, { sitT: me.sitT, walk: me.walk, ph: me.ph, waveW: waveW(me.waveStart, elapsed) }, me.x, me.z, me.r, elapsed);
  net.update(dt, elapsed);
  updateCamera(elapsed, dt);
  updateLabels();
  amb.update(act, trig);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
updateEnv(simNow());
net.connect();
requestAnimationFrame(frame);
window.__dbg = { env, T, setMode, view, amb, me, net, setSit, doWave };
</script>
